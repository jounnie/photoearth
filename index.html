<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhotoEarth – Wo wurde das Foto aufgenommen?</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f0f13;
      color: #e8e8f0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 14px 20px;
      background: #17171f;
      border-bottom: 1px solid #2a2a38;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: -0.01em; }
    header span { font-size: 1.4rem; }

    .main { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar ── */
    .sidebar {
      width: 300px;
      flex-shrink: 0;
      background: #17171f;
      border-right: 1px solid #2a2a38;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .drop-zone {
      margin: 16px 16px 12px;
      border: 2px dashed #3a3a52;
      border-radius: 12px;
      padding: 22px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      flex-shrink: 0;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: #6c8fff;
      background: rgba(108,143,255,0.07);
    }
    .drop-zone .icon { font-size: 1.8rem; margin-bottom: 6px; }
    .drop-zone p  { font-size: 0.8rem; color: #9090b0; line-height: 1.5; }
    .drop-zone strong { color: #c0c0e0; }
    #file-input { display: none; }

    /* ── Filter bar ── */
    .filter-bar {
      display: flex;
      gap: 6px;
      padding: 0 12px 10px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .filter-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 99px;
      border: 1px solid #2a2a40;
      background: transparent;
      color: #9090b8;
      font-size: 0.72rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .filter-btn:hover { background: #22223a; color: #c0c0e0; }

    .filter-btn.active { color: #e8e8f8; border-color: transparent; }
    .filter-btn[data-filter="all"].active  { background: #2a2a48; }
    .filter-btn[data-filter="ok"].active   { background: #1a3a28; border-color: #30604a; color: #50e090; }
    .filter-btn[data-filter="zero"].active { background: #2e2a10; border-color: #5a4e18; color: #d0b040; }
    .filter-btn[data-filter="none"].active { background: #3a1a1a; border-color: #602020; color: #e07070; }

    .filter-btn .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .filter-btn[data-filter="ok"]   .dot { background: #50e090; }
    .filter-btn[data-filter="zero"] .dot { background: #d0b040; }
    .filter-btn[data-filter="none"] .dot { background: #e07070; }

    .filter-btn .count {
      background: rgba(255,255,255,0.08);
      border-radius: 99px;
      padding: 1px 6px;
      font-size: 0.66rem;
      min-width: 18px;
      text-align: center;
    }

    /* ── Photo list ── */
    .photo-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 8px 12px;
    }
    .photo-list::-webkit-scrollbar { width: 5px; }
    .photo-list::-webkit-scrollbar-track { background: transparent; }
    .photo-list::-webkit-scrollbar-thumb { background: #2a2a38; border-radius: 99px; }

    /* ── Group section ── */
    .group { margin-bottom: 4px; }
    .group[hidden] { display: none; }

    .group-header {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 6px 4px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #60607a;
      user-select: none;
      cursor: pointer;
    }
    .group-header:hover { color: #9090b0; }
    .group-header .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .group-header[data-type="ok"]   .dot { background: #50e090; }
    .group-header[data-type="zero"] .dot { background: #d0b040; }
    .group-header[data-type="none"] .dot { background: #e07070; }
    .group-header .g-count { margin-left: auto; font-weight: 400; color: #50507a; }
    .group-header .chevron {
      transition: transform 0.2s;
      font-style: normal;
      font-size: 0.65rem;
      color: #50507a;
    }
    .group.collapsed .chevron { transform: rotate(-90deg); }
    .group.collapsed .group-items { display: none; }

    /* ── Photo item ── */
    .photo-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 2px;
    }
    .photo-item:hover  { background: #22223a; }
    .photo-item.active { background: #2a2a4a; }

    .photo-item img {
      width: 40px; height: 40px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .photo-item .info { min-width: 0; flex: 1; }
    .photo-item .name {
      font-size: 0.78rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #d8d8f0;
    }
    .photo-item .coords { font-size: 0.68rem; color: #7070a0; margin-top: 2px; }

    /* ── Map ── */
    #map { flex: 1; z-index: 0; }

    .leaflet-popup-content-wrapper {
      background: #1e1e2e; color: #e8e8f0;
      border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .leaflet-popup-tip { background: #1e1e2e; }
    .leaflet-popup-content { margin: 10px 14px; font-size: 0.82rem; line-height: 1.6; }
    .leaflet-popup-content img {
      width: 160px; height: 100px;
      object-fit: cover; border-radius: 6px;
      display: block; margin-bottom: 6px;
    }
    .popup-name { font-weight: 600; color: #c8c8f0; }
    .popup-coords { color: #7878a8; font-size: 0.73rem; }

    /* ── Empty state ── */
    .empty-state {
      padding: 32px 16px;
      display: flex; flex-direction: column;
      align-items: center; gap: 8px;
    }
    .empty-state .big { font-size: 2.5rem; }
    .empty-state p { font-size: 0.8rem; color: #50507a; text-align: center; }
  </style>
</head>
<body>

<header>
  <span>🌍</span>
  <h1>PhotoEarth</h1>
</header>

<div class="main">
  <aside class="sidebar">

    <div class="drop-zone" id="drop-zone">
      <div class="icon">📷</div>
      <p><strong>Fotos hierher ziehen</strong><br>oder klicken zum Auswählen</p>
      <input type="file" id="file-input" accept="image/*" multiple />
    </div>

    <!-- Filter bar (hidden until first photo) -->
    <div class="filter-bar" id="filter-bar" hidden>
      <button class="filter-btn active" data-filter="all">
        Alle <span class="count" id="count-all">0</span>
      </button>
      <button class="filter-btn" data-filter="ok">
        <span class="dot"></span>GPS
        <span class="count" id="count-ok">0</span>
      </button>
      <button class="filter-btn" data-filter="zero">
        <span class="dot"></span>0,0
        <span class="count" id="count-zero">0</span>
      </button>
      <button class="filter-btn" data-filter="none">
        <span class="dot"></span>Kein GPS
        <span class="count" id="count-none">0</span>
      </button>
    </div>

    <div class="photo-list" id="photo-list">
      <div class="empty-state" id="empty-state">
        <div class="big">🗺️</div>
        <p>Noch keine Fotos geladen</p>
      </div>

      <!-- Groups (rendered by JS, shown here as anchors) -->
    </div>

  </aside>

  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/exifr@7.1.3/dist/full.umd.js"></script>

<script>
  // ── Map ───────────────────────────────────────────────────────────────────
  const map = L.map('map', { zoomControl: true }).setView([20, 10], 2);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://carto.com/">CARTO</a> &copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>',
    maxZoom: 19,
  }).addTo(map);

  function makeIcon(color) {
    return L.divIcon({
      className: '',
      html: `<svg width="28" height="36" viewBox="0 0 28 36" xmlns="http://www.w3.org/2000/svg">
        <path d="M14 0C6.27 0 0 6.27 0 14c0 9.75 14 22 14 22S28 23.75 28 14C28 6.27 21.73 0 14 0z" fill="${color}"/>
        <circle cx="14" cy="14" r="6" fill="white"/>
      </svg>`,
      iconSize: [28,36], iconAnchor: [14,36], popupAnchor: [0,-36],
    });
  }

  // ── GPS-Typ ───────────────────────────────────────────────────────────────
  function gpsType(lat, lng) {
    if (lat === null) return 'none';
    if (lat === 0 && lng === 0) return 'zero';
    return 'ok';
  }

  const GROUP_META = {
    ok:   { label: 'GPS vorhanden',  markerColor: '#6c8fff', activeColor: '#ff8c42' },
    zero: { label: 'Koordinate 0, 0', markerColor: '#b0902a', activeColor: '#ffd040' },
    none: { label: 'Kein GPS',        markerColor: null,      activeColor: null      },
  };

  // ── State ─────────────────────────────────────────────────────────────────
  const photos = [];
  let activeIndex = -1;
  let activeFilter = 'all';

  // ── DOM refs ──────────────────────────────────────────────────────────────
  const dropZone   = document.getElementById('drop-zone');
  const fileInput  = document.getElementById('file-input');
  const photoList  = document.getElementById('photo-list');
  const emptyState = document.getElementById('empty-state');
  const filterBar  = document.getElementById('filter-bar');

  // ── Build group containers ────────────────────────────────────────────────
  const groupEls = {};
  for (const type of ['ok', 'zero', 'none']) {
    const meta = GROUP_META[type];
    const g = document.createElement('div');
    g.className = 'group';
    g.dataset.type = type;
    g.hidden = true;
    g.innerHTML = `
      <div class="group-header" data-type="${type}">
        <span class="dot"></span>
        <span class="g-label">${meta.label}</span>
        <span class="g-count">0</span>
        <i class="chevron">▾</i>
      </div>
      <div class="group-items"></div>
    `;
    g.querySelector('.group-header').addEventListener('click', () => {
      g.classList.toggle('collapsed');
    });
    photoList.appendChild(g);
    groupEls[type] = g;
  }

  // ── Filter buttons ────────────────────────────────────────────────────────
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeFilter = btn.dataset.filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyFilter();
    });
  });

  function applyFilter() {
    for (const type of ['ok', 'zero', 'none']) {
      const g = groupEls[type];
      const hasItems = g.querySelector('.group-items').children.length > 0;
      g.hidden = !hasItems || (activeFilter !== 'all' && activeFilter !== type);
    }
  }

  // ── Counts ────────────────────────────────────────────────────────────────
  function updateCounts() {
    const totals = { ok: 0, zero: 0, none: 0 };
    for (const p of photos) totals[p.gpsType]++;
    document.getElementById('count-all').textContent  = photos.length;
    document.getElementById('count-ok').textContent   = totals.ok;
    document.getElementById('count-zero').textContent = totals.zero;
    document.getElementById('count-none').textContent = totals.none;

    for (const type of ['ok', 'zero', 'none']) {
      groupEls[type].querySelector('.g-count').textContent = totals[type];
    }
  }

  // ── Drag & Drop ───────────────────────────────────────────────────────────
  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => handleFiles(e.target.files));
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    handleFiles(e.dataTransfer.files);
  });

  async function handleFiles(fileList) {
    const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
    for (const file of files) await processFile(file);
  }

  // ── Process file ──────────────────────────────────────────────────────────
  async function processFile(file) {
    const src = await readAsDataURL(file);

    let lat = null, lng = null;
    try {
      const gps = await exifr.gps(file);
      if (gps) { lat = gps.latitude; lng = gps.longitude; }
    } catch (_) {}

    const type = gpsType(lat, lng);
    const meta  = GROUP_META[type];
    const idx   = photos.length;

    const photo = { name: file.name, src, lat, lng, gpsType: type, marker: null, listEl: null };
    photos.push(photo);

    // First photo: reveal filter bar, hide empty state
    if (photos.length === 1) {
      emptyState.remove();
      filterBar.hidden = false;
    }

    // ── List item ──
    const coordText = type === 'ok'   ? `${lat.toFixed(5)}, ${lng.toFixed(5)}`
                    : type === 'zero' ? '0.0, 0.0 — ungültig'
                    :                   'Kein GPS';

    const item = document.createElement('div');
    item.className = 'photo-item';
    item.innerHTML = `
      <img src="${src}" alt="${esc(file.name)}" />
      <div class="info">
        <div class="name">${esc(file.name)}</div>
        <div class="coords">${coordText}</div>
      </div>
    `;
    item.addEventListener('click', () => focusPhoto(idx));

    const groupEl = groupEls[type];
    groupEl.querySelector('.group-items').appendChild(item);
    groupEl.hidden = false;
    photo.listEl = item;

    // ── Map marker ──
    if (type === 'ok') {
      const marker = L.marker([lat, lng], { icon: makeIcon(meta.markerColor) })
        .addTo(map)
        .bindPopup(`
          <img src="${src}" alt="${esc(file.name)}" />
          <div class="popup-name">${esc(file.name)}</div>
          <div class="popup-coords">${lat.toFixed(6)}, ${lng.toFixed(6)}</div>
        `);
      marker.on('click', () => focusPhoto(idx));
      photo.marker = marker;
    }

    updateCounts();
    applyFilter();

    // Auto-focus first valid GPS photo
    if (type === 'ok' && photos.filter(p => p.gpsType === 'ok').length === 1) {
      focusPhoto(idx);
    }
    fitMapToMarkers();
  }

  // ── Focus ─────────────────────────────────────────────────────────────────
  function focusPhoto(idx) {
    if (activeIndex >= 0 && photos[activeIndex]) {
      photos[activeIndex].listEl?.classList.remove('active');
      const prev = photos[activeIndex];
      if (prev.marker) prev.marker.setIcon(makeIcon(GROUP_META[prev.gpsType].markerColor));
    }

    activeIndex = idx;
    const photo = photos[idx];
    photo.listEl?.classList.add('active');
    photo.listEl?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });

    if (photo.marker) {
      photo.marker.setIcon(makeIcon(GROUP_META[photo.gpsType].activeColor));
      map.setView([photo.lat, photo.lng], Math.max(map.getZoom(), 13), { animate: true });
      photo.marker.openPopup();
    }
  }

  // ── Fit map ───────────────────────────────────────────────────────────────
  function fitMapToMarkers() {
    const pts = photos.filter(p => p.gpsType === 'ok').map(p => [p.lat, p.lng]);
    if (pts.length === 0) return;
    if (pts.length === 1) { map.setView(pts[0], 13); return; }
    map.fitBounds(L.latLngBounds(pts), { padding: [40,40], maxZoom: 14, animate: true });
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  function readAsDataURL(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = e => res(e.target.result);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
  }

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>

</body>
</html>
